name: Go
on:
  pull_request:
    branches: [ "main", "versions/*", "danjok/testbuilds/*"]
    types: [ closed ]

permissions:
  contents: write

jobs:
  build:
    # Only run when PR is merged AND the source branch starts with "release"
    if: (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release')) || contains(github.event.pull_request.title, 'test') 
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          $env:Path += ";$env:USERPROFILE\go\bin"
      - name: Build
        run: wails build -platform windows/amd64 -clean
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDT-windows
          path: build/bin/LDT.exe

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: LDT-windows
      - name: Install NSIS
        run: choco install nsis --version=3.09 -y
      - name: Build installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" "LDT-installer.nsi"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDT-installer
          path: LDT-installer.exe

  release:
    needs: [build, installer]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: LDT-windows
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: LDT-installer
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LDT.exe
            LDT-installer.exe
          generate_release_notes: true
          tag_name: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
