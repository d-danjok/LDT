name: Go
on:
  pull_request:
    branches: [ "main", "versions/*", "danjok/testbuilds/*"]
    types: [ closed ]

permissions:
  contents: write

jobs:
  build:
    # Only run when PR is merged AND the source branch starts with "release"
    if: (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release')) || contains(github.event.pull_request.title, 'test') 
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest
      - name: Embed icon
        run: go-winres simply --icon src/icons/mimi-icon.png
      - name: Build
        run: go build -ldflags="-s -w" -o LDT.exe .
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDT-windows
          path: LDT.exe

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: LDT-windows
      - name: Install NSIS
        run: |
          $nisisUrl = "https://sourceforge.net/projects/nsis/files/NSIS%203/3.09/nsis-3.09-setup.exe/download"
          $nsisFile = "nsis-setup.exe"

          # Download with retry logic
          $maxRetries = 3
          $retryCount = 0
          $downloaded = $false

          while ($retryCount -lt $maxRetries -and -not $downloaded) {
            try {
              Write-Host "Downloading NSIS (attempt $($retryCount + 1))..."
              Invoke-WebRequest -Uri $nisisUrl -OutFile $nsisFile -UseBasicParsing

              # Verify file exists and has reasonable size
              if ((Test-Path $nsisFile) -and (Get-Item $nsisFile).Length -gt 1MB) {
                $downloaded = $true
                Write-Host "Download successful"
              } else {
                Write-Host "Downloaded file is too small or doesn't exist"
                Remove-Item $nsisFile -ErrorAction SilentlyContinue
              }
            } catch {
              Write-Host "Download failed: $_"
            }
            $retryCount++
            if (-not $downloaded -and $retryCount -lt $maxRetries) { Start-Sleep -Seconds 5 }
          }

          if (-not $downloaded) {
            throw "Failed to download NSIS after $maxRetries attempts"
          }

          Start-Process -FilePath $nsisFile -ArgumentList "/S" -Wait
      - name: Build installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" "LDT-installer.nsi"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDT-installer
          path: LDT-installer.exe

  release:
    needs: [build, installer]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: LDT-windows
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: LDT-installer
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LDT.exe
            LDT-installer.exe
          generate_release_notes: true
          tag_name: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
