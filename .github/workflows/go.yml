name: Go

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Embed icon
        run: go-winres simply --icon src/icons/mimi-icon.png

      - name: Build
        run: go build -ldflags="-s -w" -o LDT.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDT-windows
          path: LDT.exe

  release:
    needs: build
    runs-on: windows-latest   # ← windows here too, no ubuntu
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: LDT-windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: LDT.exe
          generate_release_notes: true
